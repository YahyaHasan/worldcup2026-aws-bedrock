AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: World Cup 2026 Tournament Companion Agent — infrastructure

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12

Resources:

  SimulateMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: simulate-match
      CodeUri: src/tools/simulate_match/
      Handler: app.lambda_handler
  
  ScheduleStandingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: schedule-standings
      CodeUri: src/tools/schedule_standings/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchesTable
        - DynamoDBReadPolicy:
            TableName: !Ref GroupStandingsTable
  
  NewsSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: news-search
      CodeUri: src/tools/news_search/
      Handler: app.lambda_handler
      Timeout: 30
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: worldcup2026/tavily-api-key
  
  MemoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: memory
      CodeUri: src/tools/memory/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionMemoryTable
  
  OrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: orchestrator
      CodeUri: src/orchestrator/
      Handler: app.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          GUARDRAIL_ID: na24m8dv4qnj
          GUARDRAIL_VERSION: "6"
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref SimulateMatchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ScheduleStandingsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NewsSearchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MemoryFunction
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:ApplyGuardrail
              Resource: "*"

  TeamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Teams
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: team_id
          AttributeType: S
      KeySchema:
        - AttributeName: team_id
          KeyType: HASH

  MatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Matches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: match_id
          AttributeType: S
      KeySchema:
        - AttributeName: match_id
          KeyType: HASH

  GroupStandingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GroupStandings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: group_id
          AttributeType: S
        - AttributeName: team_id
          AttributeType: S
      KeySchema:
        - AttributeName: group_id
          KeyType: HASH
        - AttributeName: team_id
          KeyType: RANGE

  SessionMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SessionMemory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
